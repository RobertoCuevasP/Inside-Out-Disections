<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de buildEdgePair</title>
</head>
<body>
  <h1>Prueba del lado AB</h1>
  <pre id="resultado">Cargando la prueba…</pre>

  <script type="module">
    import { buildEdgePair } from "./src/geometry.js";

    const A = { x: 0, y: 0 };
    const B = { x: 10, y: 0 };
    const alpha = Math.atan2(7, 24);

    const { M, C, D } = buildEdgePair(A, B, alpha);

    const mostrar = ({ x, y }) => `(${x.toFixed(2)}, ${y.toFixed(2)})`;

    document.querySelector("#resultado").textContent =
      `M = ${mostrar(M)}\nC = ${mostrar(C)}\nD = ${mostrar(D)}`;
  </script>
</body>
</html>
